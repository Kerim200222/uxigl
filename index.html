<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>uxiGL — Liquid Glass × Dinamik Tonal Tasarım Sistemi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: Inter, Plus Jakarta Sans, Outfit (Material You), DM Sans, Space Grotesk, JetBrains Mono & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Material Symbols Variable Font Icons (Rounded, Outlined & Sharp with opsz, wght, FILL, GRAD axes) -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <style id="uxu-font-cloak">
      /* FOUT/FOIT Cloak: Google font ikonları yüklenene kadar ham ligatür metinlerinin görünmesini engeller */
      html.uxu-icon-fonts-loading .uxu-google-icon,
      .uxu-icon-fonts-loading .uxu-google-icon {
        visibility: hidden !important;
        opacity: 0 !important;
      }
    </style>
    <script>
      (function () {
        try {
          if ('fonts' in document && !document.fonts.check('20px "Material Symbols Rounded"')) {
            document.documentElement.classList.add('uxu-icon-fonts-loading');
            Promise.all([
              document.fonts.load('20px "Material Symbols Rounded"'),
              document.fonts.load('20px "Material Symbols Outlined"'),
              document.fonts.load('20px "Material Symbols Sharp"'),
              document.fonts.ready
            ]).then(function () {
              document.documentElement.classList.remove('uxu-icon-fonts-loading');
              document.documentElement.classList.add('uxu-icon-fonts-loaded');
            }).catch(function () {
              document.documentElement.classList.remove('uxu-icon-fonts-loading');
            });
            setTimeout(function () {
              document.documentElement.classList.remove('uxu-icon-fonts-loading');
              document.documentElement.classList.add('uxu-icon-fonts-loaded');
            }, 1800);
          } else {
            document.documentElement.classList.add('uxu-icon-fonts-loaded');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('uxu.theme.preferences') ||
            localStorage.getItem('uxu.design_system.theme_preferences.v3') ||
            localStorage.getItem('uxu.design_system.theme_preferences.v2');
          if (raw) {
            var p = JSON.parse(raw);
            var mode =
              p.mode === 'system'
                ? window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light'
                : p.mode || 'dark';
            document.documentElement.setAttribute('data-theme', mode);
            document.documentElement.style.colorScheme = mode;
            if (p.seedPalette) {
              document.documentElement.setAttribute('data-seed', p.seedPalette);
            }
            if (p.webglEnabled !== undefined) {
              document.documentElement.setAttribute(
                'data-webgl',
                String(Boolean(p.webglEnabled))
              );
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
